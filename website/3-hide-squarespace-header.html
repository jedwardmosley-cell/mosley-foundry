<!-- Paste into each page: Settings (gear) > Advanced > Page Header Code Injection.
     Hides Squarespace's own header and footer on this page and removes the extra padding around the Code Block. -->
<style>
  #header, #footer-sections, .sqs-announcement-bar-dropzone { display: none !important; }
  .page-section, .page-section .content-wrapper, .sqs-block-code, .sqs-block { padding: 0 !important; min-height: 0 !important; }
  .page-section .content-wrapper { max-width: none !important; }
  .page-section .section-background { background: #18161a !important; }
  body { overflow-x: hidden; }
  /* Keep Squarespace heading and text styles from overriding the custom design */
  #mf h1, #mf h2, #mf h3, #mf p, #mf li, #mf a, #mf span, #mf blockquote, #mf figcaption, #mf dt, #mf dd, #mf strong, #mf b, #mf em { color: inherit; font-family: inherit; line-height: inherit; }
  /* Contact page: style the Squarespace form to match */
  .sqs-block-form { max-width: 720px; margin: 0 auto !important; padding: 0 20px 80px !important; }
  .sqs-block-form, .sqs-block-form * { font-family: "Barlow", "Helvetica Neue", Arial, sans-serif !important; }
  .sqs-block-form label, .sqs-block-form legend, .sqs-block-form .title, .sqs-block-form .description, .sqs-block-form p, .sqs-block-form span, .sqs-block-form .form-submission-text { color: #f4efe9 !important; }
  .sqs-block-form input:not([type=checkbox]):not([type=radio]), .sqs-block-form textarea, .sqs-block-form select { background: #231f24 !important; color: #f4efe9 !important; border: 1px solid #3a3439 !important; border-radius: 2px !important; padding: 14px 16px !important; }
  .sqs-block-form input:focus, .sqs-block-form textarea:focus, .sqs-block-form select:focus { border-color: #c8773a !important; outline: none !important; }
  .sqs-block-form ::placeholder { color: #8c8389 !important; }
  .sqs-block-form button, .sqs-block-form input[type=submit] { background: linear-gradient(100deg, #7d2230, #c8773a 45%, #f2a541) !important; color: #18161a !important; border: 0 !important; border-radius: 2px !important; font-family: "Big Shoulders Display", Impact, sans-serif !important; font-weight: 800 !important; font-size: 22px !important; letter-spacing: .04em !important; text-transform: uppercase !important; padding: 16px 28px !important; }
  .sqs-block-form button * { color: #18161a !important; font-family: "Big Shoulders Display", Impact, sans-serif !important; }
</style>
