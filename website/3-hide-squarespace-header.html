<!-- Paste into each page: Settings (gear) > Advanced > Page Header Code Injection.
     Hides Squarespace's own header and footer on this page and removes the extra padding around the Code Block. -->
<style>
  #header, #footer-sections, .sqs-announcement-bar-dropzone { display: none !important; }
  .page-section, .page-section .content-wrapper, .sqs-block-code, .sqs-block { padding: 0 !important; min-height: 0 !important; }
  .page-section .content-wrapper { max-width: none !important; }
  .page-section .section-background { background: #ffffff !important; }
  body { overflow-x: hidden; }
  /* Keep Squarespace heading and text styles from overriding the custom design */
  #mf h1, #mf h2, #mf h3, #mf p, #mf li, #mf a, #mf span, #mf blockquote, #mf figcaption, #mf dt, #mf dd, #mf strong, #mf b, #mf em { color: inherit; font-family: inherit; line-height: inherit; }
  /* Contact page: style the Squarespace form to match */
  .sqs-block-form { max-width: 720px; margin: 0 auto !important; padding: 0 24px 80px !important; }
  .sqs-block-form, .sqs-block-form * { font-family: "Inter", "Helvetica Neue", Arial, sans-serif !important; }
  .sqs-block-form label, .sqs-block-form legend, .sqs-block-form .title, .sqs-block-form p, .sqs-block-form span, .sqs-block-form .form-submission-text { color: #14213d !important; }
  .sqs-block-form .description { color: #5d6370 !important; }
  .sqs-block-form input:not([type=checkbox]):not([type=radio]), .sqs-block-form textarea, .sqs-block-form select { background: #ffffff !important; color: #2a2f3a !important; border: 1px solid #cfccc5 !important; border-radius: 4px !important; padding: 13px 14px !important; }
  .sqs-block-form input:focus, .sqs-block-form textarea:focus, .sqs-block-form select:focus { border-color: #14213d !important; outline: none !important; }
  .sqs-block-form button, .sqs-block-form input[type=submit] { background: #7a1f2b !important; color: #ffffff !important; border: 0 !important; border-radius: 4px !important; font-weight: 600 !important; font-size: 16px !important; letter-spacing: .01em !important; text-transform: none !important; padding: 15px 24px !important; }
  .sqs-block-form button * { color: #ffffff !important; }
</style>
