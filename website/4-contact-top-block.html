<style>#mf{width:100vw;position:relative;left:50%;margin-left:-50vw;}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: white and mist-gray bands with a 1180px inner wrap; navy only for the marquee, gut check, closing call and footer.
   Color: navy ink, one oxblood accent, warm-neutral grays. Type: Archivo for headlines, Inter for text. */
#mf {
  --paper: #ffffff;
  --mist: #f4f3f0;
  --line: #e3e1dc;
  --ink: #14213d;
  --text: #2a2f3a;
  --muted: #5d6370;
  --navy: #14213d;
  --navy-deep: #0e182e;
  --navy-line: rgba(255,255,255,.16);
  --on-navy: #ffffff;
  --on-navy-muted: #b8bfcd;
  --accent: #7a1f2b;
  --accent-on-navy: #e2b08f;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  background: var(--paper);
  color: var(--text);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#mf *, #mf *::before, #mf *::after { box-sizing: border-box; }
#mf h1, #mf h2, #mf h3, #mf p, #mf ul, #mf ol, #mf blockquote, #mf figure, #mf dl, #mf dd { margin: 0; padding: 0; }
#mf ul, #mf ol { list-style: none; }
#mf h1, #mf h2, #mf h3, #mf p, #mf li, #mf a, #mf span, #mf blockquote, #mf figcaption, #mf dt, #mf dd, #mf strong, #mf b, #mf em { color: inherit; font-family: inherit; line-height: inherit; }
#mf img { max-width: 100%; display: block; }
#mf button { font: inherit; color: inherit; cursor: pointer; }
#mf :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
#mf .mf-sparks { display: none; }

#mf .mf-wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
#mf .mf-band { padding-block: clamp(72px, 9vw, 120px); background: var(--paper); }
#mf .mf-light { background: var(--mist); }
#mf .mf-iron2, #mf .mf-final { background: var(--navy); color: var(--on-navy); }

/* Type */
#mf .mf-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
#mf .mf-iron2 .mf-eyebrow, #mf .mf-final .mf-eyebrow { color: var(--accent-on-navy); }
#mf .mf-h2, #mf h1 {
  font-family: var(--display); font-weight: 700; color: var(--ink); letter-spacing: -.02em; text-wrap: balance;
}
#mf .mf-h2 { font-size: clamp(34px, 4.4vw, 56px); line-height: 1.06; margin-top: 14px; max-width: 22ch; }
#mf .mf-iron2 .mf-h2, #mf .mf-final .mf-h2, #mf .mf-iron2 h1 { color: var(--on-navy); }
#mf .mf-lede { font-size: clamp(18px, 1.5vw, 20px); max-width: 58ch; margin-top: 20px; color: var(--muted); }
#mf .mf-iron2 .mf-lede, #mf .mf-final .mf-lede { color: var(--on-navy-muted); }

/* Buttons */
#mf .mf-btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font-family: var(--body); font-weight: 600; font-size: 16px; letter-spacing: .01em;
  padding: 15px 24px; border-radius: 4px; border: 1.5px solid transparent;
  transition: background-color .2s ease, border-color .2s ease, color .2s ease;
}
#mf .mf-btn-hot { background: var(--accent); color: #fff; }
#mf .mf-btn-hot:hover { background: #5f1621; }
#mf .mf-btn-ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
#mf .mf-btn-ghost:hover { background: var(--ink); color: #fff; }
#mf .mf-iron2 .mf-btn-hot, #mf .mf-final .mf-btn-hot { background: #fff; color: var(--navy); }
#mf .mf-iron2 .mf-btn-hot:hover, #mf .mf-final .mf-btn-hot:hover { background: var(--mist); }
#mf .mf-btn .mf-arrow { transition: transform .2s ease; }
#mf .mf-btn:hover .mf-arrow { transform: translateX(3px); }
#mf .mf-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

/* Nav */
#mf .mf-nav { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
#mf .mf-nav .mf-wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 72px; }
#mf .mf-logo { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
#mf .mf-logo-mark { width: 10px; height: 22px; background: var(--accent); }
#mf .mf-links { display: flex; gap: 28px; align-items: center; }
#mf .mf-links a { font-size: 15px; font-weight: 500; text-decoration: none; color: var(--muted); }
#mf .mf-links a:hover { color: var(--ink); }
#mf .mf-links .mf-btn { font-size: 14px; padding: 10px 16px; color: #fff; white-space: nowrap; }
@media (max-width: 860px) { #mf .mf-links a:not(.mf-btn) { display: none; } }
@media (max-width: 420px) { #mf .mf-logo { font-size: 18px; } #mf .mf-links .mf-btn { padding: 9px 12px; } }

/* Hero */
#mf .mf-hero { padding-block: clamp(56px, 8vw, 104px); background: var(--paper); }
#mf .mf-hero .mf-wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
#mf .mf-hero h1 { font-size: clamp(46px, 6.6vw, 92px); line-height: 1; letter-spacing: -.035em; margin-top: 18px; }
#mf .mf-hero h1 .mf-hot { color: var(--accent); }
#mf .mf-hero .mf-lede { font-size: clamp(19px, 1.7vw, 22px); color: var(--text); max-width: 40ch; }
#mf .mf-portrait { max-width: 420px; width: 100%; justify-self: end; }
#mf .mf-portrait img { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 22%; border-radius: 4px; }
#mf .mf-tag { margin-top: 14px; font-size: 14px; color: var(--muted); }
#mf .mf-tag strong { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); }
@media (max-width: 860px) {
  #mf .mf-hero .mf-wrap { grid-template-columns: minmax(0, 1fr); }
  #mf .mf-portrait { justify-self: start; max-width: 340px; }
}

/* Marquee */
#mf .mf-marquee { background: var(--navy); color: var(--on-navy); overflow: hidden; padding-block: 18px; }
#mf .mf-track { display: flex; width: max-content; animation: mf-scroll 60s linear infinite; }
#mf .mf-track span { font-family: var(--display); font-weight: 600; font-size: clamp(18px, 2vw, 24px); padding-right: 36px; white-space: nowrap; display: inline-flex; align-items: center; gap: 36px; }
#mf .mf-track span::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-on-navy); }
@keyframes mf-scroll { to { transform: translateX(-50%); } }

/* Numbers */
#mf .mf-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 52px; border-top: 1px solid var(--line); }
#mf .mf-stat { padding: 28px 24px 0 0; }
#mf .mf-stat + .mf-stat { padding-left: 24px; border-left: 1px solid var(--line); }
#mf .mf-num { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 5.4vw, 72px); line-height: 1; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
#mf .mf-stat p { color: var(--muted); font-size: 16px; margin-top: 12px; max-width: 26ch; }
@media (max-width: 860px) {
  #mf .mf-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #mf .mf-stat, #mf .mf-stat + .mf-stat { padding: 24px 12px 24px 0; border-left: 0; border-bottom: 1px solid var(--line); }
}

/* Cards (Leadership Series, ProcessIQ gaps) */
#mf .mf-series-head, #mf .mf-piq-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: end; }
#mf .mf-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 52px; }
#mf .mf-cards-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#mf .mf-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 28px 26px 30px; min-width: 0; transition: border-color .2s ease; }
#mf .mf-card:hover { border-color: var(--ink); }
#mf .mf-card-num { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
#mf .mf-card h3 { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.2; letter-spacing: -.01em; color: var(--ink); margin-top: 14px; }
#mf .mf-card p { color: var(--muted); font-size: 16px; margin-top: 10px; }
@media (max-width: 960px) { #mf .mf-cards, #mf .mf-cards-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } #mf .mf-series-head, #mf .mf-piq-head { grid-template-columns: minmax(0, 1fr); gap: 0; } }
@media (max-width: 620px) { #mf .mf-cards, #mf .mf-cards-4 { grid-template-columns: minmax(0, 1fr); } }

/* Two-column text + list (AI, trust) */
#mf .mf-ai { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
#mf .mf-steps { border-top: 1px solid var(--line); }
#mf .mf-step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
#mf .mf-step-icon { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--accent); padding-top: 3px; }
#mf .mf-step h3 { font-family: var(--display); font-weight: 700; font-size: 21px; color: var(--ink); line-height: 1.25; }
#mf .mf-step p { color: var(--muted); font-size: 16px; margin-top: 4px; }
#mf .mf-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
#mf .mf-chip { font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; color: var(--text); }
@media (max-width: 860px) { #mf .mf-ai { grid-template-columns: minmax(0, 1fr); } }

/* ProcessIQ strip */
#mf .mf-strip { padding-block: clamp(36px, 5vw, 56px); }
#mf .mf-strip .mf-wrap { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center; justify-content: space-between; }
#mf .mf-strip-text { font-family: var(--display); font-weight: 500; font-size: clamp(21px, 2.2vw, 27px); line-height: 1.3; color: var(--ink); margin-top: 8px; max-width: 40ch; }
#mf .mf-strip-text b { font-weight: 800; color: var(--accent); }

/* Gut check */
#mf .mf-quiz { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
#mf .mf-qbox { background: var(--paper); color: var(--text); border-radius: 8px; padding: clamp(24px, 4vw, 40px); }
#mf .mf-qbar { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
#mf .mf-qbar i { display: block; height: 100%; width: 20%; background: var(--accent); transition: width .35s ease; }
#mf .mf-qmeta { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#mf .mf-qtext { font-family: var(--display); font-weight: 700; font-size: clamp(23px, 2.4vw, 30px); line-height: 1.2; color: var(--ink); margin-top: 8px; text-wrap: balance; }
#mf .mf-opts { display: grid; gap: 10px; margin-top: 22px; }
#mf .mf-opt { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; font-size: 16px; line-height: 1.4; display: flex; gap: 14px; align-items: center; transition: border-color .2s ease, background-color .2s ease; }
#mf .mf-opt:hover { border-color: var(--ink); background: var(--mist); }
#mf .mf-opt b { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--mist); color: var(--ink); font-size: 13px; font-weight: 600; }
#mf .mf-result h3 { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; color: var(--accent); margin-top: 10px; }
#mf .mf-result p { color: var(--muted); margin-top: 12px; }
#mf .mf-result .mf-ctas { margin-top: 24px; }
#mf .mf-result .mf-btn-hot { background: var(--accent); color: #fff; }
#mf .mf-reset { background: none; border: 0; text-decoration: underline; text-underline-offset: 4px; color: var(--muted); font-size: 15px; padding: 0; }
@media (max-width: 860px) { #mf .mf-quiz { grid-template-columns: minmax(0, 1fr); } }

/* Process (Heat. Hammer. Temper.) */
#mf .mf-process { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(20px, 3vw, 40px); margin-top: 52px; }
#mf .mf-proc { border-top: 2px solid var(--ink); padding-top: 20px; }
#mf .mf-proc-tag { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
#mf .mf-proc h3 { font-family: var(--display); font-weight: 700; font-size: 28px; color: var(--ink); line-height: 1.1; margin-top: 8px; }
#mf .mf-proc p { color: var(--muted); margin-top: 10px; font-size: 16px; }
@media (max-width: 760px) { #mf .mf-process { grid-template-columns: minmax(0, 1fr); } }

/* Testimonials */
#mf .mf-quotes { margin-top: 36px; display: grid; grid-template-columns: minmax(0, 1fr); }
#mf .mf-q { grid-area: 1 / 1; opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility .4s; }
#mf .mf-q.is-on { opacity: 1; visibility: visible; }
#mf .mf-q blockquote { font-family: var(--display); font-weight: 500; font-size: clamp(25px, 3vw, 38px); line-height: 1.3; letter-spacing: -.01em; color: var(--ink); max-width: 34ch; }
#mf .mf-q blockquote::before { content: "\201C"; display: block; font-family: Georgia, serif; font-size: 72px; line-height: .8; color: var(--accent); margin-bottom: 6px; }
#mf .mf-q figcaption { margin-top: 24px; font-weight: 600; font-size: 16px; color: var(--ink); }
#mf .mf-q figcaption span { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
#mf .mf-qnav { display: flex; align-items: center; gap: 12px; margin-top: 36px; }
#mf .mf-arrowbtn { width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 18px; color: var(--ink); transition: border-color .2s ease; }
#mf .mf-arrowbtn:hover { border-color: var(--ink); }
#mf .mf-count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; }
#mf .mf-dots { display: flex; gap: 6px; margin-left: auto; }
#mf .mf-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--line); }
#mf .mf-dots button.is-on { background: var(--accent); }
@media (max-width: 620px) { #mf .mf-dots { display: none; } }

/* About */
#mf .mf-about { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(32px, 6vw, 80px); }
#mf .mf-about-copy p { color: var(--muted); margin-top: 16px; max-width: 60ch; }
#mf .mf-about-copy p.mf-big { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 2.8vw, 36px); line-height: 1.15; letter-spacing: -.02em; color: var(--accent); margin-top: 24px; }
#mf .mf-facts { align-self: start; border-top: 1px solid var(--line); }
#mf .mf-fact { padding: 18px 0; border-bottom: 1px solid var(--line); }
#mf .mf-fact dt { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
#mf .mf-fact dd { margin-top: 6px; font-size: 16px; color: var(--text); }
#mf .mf-creds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
#mf .mf-iron2 .mf-facts, #mf .mf-iron2 .mf-fact { border-color: var(--navy-line); }
#mf .mf-iron2 .mf-fact dt { color: var(--accent-on-navy); }
#mf .mf-iron2 .mf-fact dd { color: var(--on-navy); }
@media (max-width: 860px) { #mf .mf-about { grid-template-columns: minmax(0, 1fr); } }

/* FAQ */
#mf .mf-faq { margin-top: 40px; border-top: 1px solid var(--ink); max-width: 860px; }
#mf .mf-faq details { border-bottom: 1px solid var(--line); }
#mf .mf-faq summary { list-style: none; cursor: pointer; padding: 20px 44px 20px 0; position: relative; font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--ink); }
#mf .mf-faq summary::-webkit-details-marker { display: none; }
#mf .mf-faq summary::after { content: "+"; position: absolute; right: 6px; top: 14px; font-size: 28px; font-weight: 400; color: var(--accent); transition: transform .2s ease; }
#mf .mf-faq details[open] summary::after { transform: rotate(45deg); }
#mf .mf-faq details p { color: var(--muted); padding-bottom: 22px; max-width: 64ch; }

/* Closing call to action */
#mf .mf-final { text-align: center; }
#mf .mf-final .mf-h2 { margin-inline: auto; max-width: 20ch; font-size: clamp(36px, 5vw, 64px); }
#mf .mf-final .mf-lede { margin-inline: auto; }
#mf .mf-final .mf-ctas { justify-content: center; }
#mf .mf-email { margin-top: 24px; font-size: 15px; color: var(--on-navy-muted); }
#mf .mf-email a { color: var(--on-navy); }
#mf .mf-light .mf-email, #mf .mf-band:not(.mf-iron2):not(.mf-final) .mf-email { color: var(--muted); }

/* Footer */
#mf .mf-foot { background: var(--navy-deep); color: var(--on-navy-muted); padding-block: 32px; font-size: 14px; }
#mf .mf-foot .mf-wrap { display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; align-items: center; }
#mf .mf-foot-line { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--on-navy); margin-bottom: 4px; }
#mf .mf-foot nav { display: flex; gap: 22px; flex-wrap: wrap; }
#mf .mf-foot a { text-decoration: none; }
#mf .mf-foot a:hover { color: var(--on-navy); }

/* ProcessIQ page */
#mf .mf-piq-hero .mf-wrap { display: block; }
#mf .mf-piq-hero h1 { max-width: 16ch; }
#mf .mf-shot { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 24px 60px -32px rgba(20,33,61,.35); }
#mf .mf-shot-bar { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--mist); }
#mf .mf-shot-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
#mf .mf-shot img { width: 100%; height: auto; }
#mf .mf-piq-hero .mf-shot { margin-top: 52px; }
#mf .mf-sample { font-size: 14px; color: var(--muted); margin-top: 14px; }
#mf .mf-feats { display: grid; gap: clamp(56px, 8vw, 96px); margin-top: 52px; }
#mf .mf-feat { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
#mf .mf-feat.mf-rev { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
#mf .mf-feat.mf-rev > :first-child { order: 2; }
#mf .mf-feat h3 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.1; letter-spacing: -.015em; color: var(--ink); margin-top: 10px; }
#mf .mf-feat p { color: var(--muted); margin-top: 12px; }
#mf .mf-trust { display: grid; gap: 14px; margin-top: 18px; }
#mf .mf-trust li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 16px; color: var(--muted); }
#mf .mf-trust li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 9px; }
#mf .mf-trust b { color: var(--ink); font-weight: 600; }
@media (max-width: 960px) { #mf .mf-feat, #mf .mf-feat.mf-rev { grid-template-columns: minmax(0, 1fr); } #mf .mf-feat.mf-rev > :first-child { order: 0; } }

/* Contact page */
#mf .mf-contact-hero { padding-block: clamp(56px, 8vw, 96px) clamp(28px, 4vw, 40px); }
#mf .mf-mockform { max-width: 720px; display: grid; gap: 18px; padding-bottom: 80px; }
#mf .mf-mockform label { display: grid; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
#mf .mf-mockform input, #mf .mf-mockform select, #mf .mf-mockform textarea { font: inherit; font-weight: 400; color: var(--text); background: #fff; border: 1px solid #cfccc5; border-radius: 4px; padding: 13px 14px; width: 100%; }
#mf .mf-mockform .mf-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
#mf .mf-mocknote { font-size: 13px; color: var(--accent); }
@media (max-width: 620px) { #mf .mf-mockform .mf-row { grid-template-columns: minmax(0, 1fr); } }

@media (prefers-reduced-motion: reduce) {
  #mf *, #mf *::before, #mf *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="mf">

<script>
(function () {
  var root = document.getElementById('mf');
  if (!root) return;
  var CAL = 'https://calendly.com/jason-mosley-mosleyfoundry/coaching-call';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var y = root.querySelector('.mf-year'); if (y) y.textContent = new Date().getFullYear();

  /* Smooth in-page links that stay inside the block */
  root.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#mf-"]');
    if (!a) return;
    var t = document.getElementById(a.getAttribute('href').slice(1));
    if (!t) return;
    e.preventDefault();
    var navH = root.querySelector('.mf-nav').offsetHeight;
    window.scrollTo({ top: t.getBoundingClientRect().top + window.pageYOffset - navH + 1, behavior: reduce ? 'auto' : 'smooth' });
  });

  /* Sparks rising from the forge */
  var cv = root.querySelector('.mf-sparks');
  if (cv && cv.getContext && !reduce) {
    var ctx = cv.getContext('2d'), sp = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), running = true;
    var size = function () { W = cv.offsetWidth; H = cv.offsetHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    var spawn = function () { return { x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * .5, vy: -(.6 + Math.random() * 1.6), life: 0, max: 140 + Math.random() * 220, r: .8 + Math.random() * 1.8 }; };
    size(); window.addEventListener('resize', size);
    for (var i = 0; i < 60; i++) { var s = spawn(); s.y = Math.random() * H; s.life = Math.random() * s.max; sp.push(s); }
    if ('IntersectionObserver' in window) new IntersectionObserver(function (en) { running = en[0].isIntersecting; if (running) requestAnimationFrame(tick); }).observe(cv);
    var tick = function () {
      if (!running) return;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < sp.length; i++) {
        var p = sp[i]; p.life++; p.x += p.vx + Math.sin((p.life + i) / 30) * .25; p.y += p.vy;
        var k = 1 - p.life / p.max;
        if (k <= 0 || p.y < -10) { sp[i] = spawn(); continue; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + (242) + ',' + Math.round(120 + 60 * k) + ',' + Math.round(40 + 20 * k) + ',' + (k * .85).toFixed(3) + ')';
        ctx.shadowColor = 'rgba(242,165,65,.8)'; ctx.shadowBlur = 8; ctx.fill();
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* Count-up numbers (they rest at their final values until seen) */
  if ('IntersectionObserver' in window && !reduce) {
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        var el = e.target, end = +el.dataset.count, suf = el.dataset.suffix || '', t0 = null;
        var step = function (ts) { if (!t0) t0 = ts; var k = Math.min((ts - t0) / 1400, 1); k = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(end * k) + suf; if (k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      });
    }, { threshold: .6 });
    root.querySelectorAll('[data-count]').forEach(function (el) { io.observe(el); });
  }

})();
</script>
